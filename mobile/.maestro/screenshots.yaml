# App Store / marketing screenshot capture for Fix Pro (iOS).
#
# Runs on a booted iOS Simulator via the `screenshots-workflow` in
# /codemagic.yaml. That workflow builds the app with
# `--dart-define=SCREENSHOT_MODE=true`, which makes SplashScreen log
# straight into the Apple-review test CLIENT account (+2250505050505) and
# jump to its home shell -- so this flow never touches the onboarding form
# or the OTP screen. It just walks the bottom-nav tabs and one trade
# detail, screenshotting each at the simulator's full native resolution.
# PNGs land in mobile/build/screenshots/ and are collected as artifacts.
#
# iOS-only: it drives the running app on a simulator; it changes no
# Android code or config.
#
# Selectors are on-screen FRENCH strings wrapped as `(?s).*text.*` --
# Maestro's tapOn is a full-string regex match and Flutter's iOS semantics
# labels carry newlines / merge sibling text, so exact matches miss.
appId: com.fixci.mobile
name: Fix Pro App Store screenshots
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# SCREENSHOT_MODE logs in during the splash; wait for the client home grid.
- extendedWaitUntil:
    visible: "(?s).*De quoi avez-vous besoin.*"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: build/screenshots/01_accueil

# --- bottom-nav tabs (done before the trade detail so there's no `back`) ---
- tapOn: "(?s).*Missions.*"
- waitForAnimationToEnd
- takeScreenshot: build/screenshots/03_missions

- tapOn: "(?s).*Historique.*"
- waitForAnimationToEnd
- takeScreenshot: build/screenshots/04_historique

- tapOn: "(?s).*Compte.*"
- waitForAnimationToEnd
- takeScreenshot: build/screenshots/05_compte

# --- back to the grid, then into a trade detail (hero image + description) ---
- tapOn: "(?s).*Accueil.*"
- extendedWaitUntil:
    visible: "(?s).*De quoi avez-vous besoin.*"
    timeout: 20000
- tapOn: "(?s).*Plombier.*"
- extendedWaitUntil:
    visible: "(?s).*Réparation de fuites.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: build/screenshots/02_metier_plombier
