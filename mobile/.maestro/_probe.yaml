# Throwaway helper: launches the app (built with SCREENSHOT_MODE=true, so it
# auto-logs-in) and waits for the client home grid, so the workflow can dump
# the UI hierarchy right after (Maestro has no in-flow "dump hierarchy"
# command). Not part of the screenshot set.
appId: com.fixci.mobile
name: probe
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "(?s).*De quoi avez-vous besoin.*"
    timeout: 90000
