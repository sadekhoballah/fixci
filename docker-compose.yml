services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fixci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixci
      POSTGRES_PASSWORD: fixci
      POSTGRES_DB: fixci
    ports:
      # Bound to localhost only — Docker manipulates iptables directly (its
      # own DOCKER-USER chain) and is known to bypass ufw's rules for
      # published ports, so relying on the firewall alone isn't safe on a
      # box with a real public IP. Nothing outside this host ever needs to
      # reach Postgres directly.
      - "127.0.0.1:5434:5432"
    volumes:
      - fixci-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixci -d fixci"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fixci-redis
    restart: unless-stopped
    ports:
      # See the postgres service's port comment above — same reasoning.
      - "127.0.0.1:6380:6379"
    volumes:
      - fixci-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fixci-postgres-data:
  fixci-redis-data:
