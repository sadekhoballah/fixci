# Reverse-proxies fix-pro.app/api/* to the NestJS backend (fixci-backend.service,
# listening on 127.0.0.1:3000). Enable with:
#   sudo cp apache-fixci-api.conf /etc/apache2/conf-available/fixci-api.conf
#   sudo a2enmod proxy proxy_http
#   sudo a2enconf fixci-api
#   sudo systemctl reload apache2
ProxyPreserveHost On
ProxyPass /api http://127.0.0.1:3000/
ProxyPassReverse /api http://127.0.0.1:3000/
