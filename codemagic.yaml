workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fix Pro Apple
    working_directory: mobile
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fixci.mobile
      groups:
        - ios_secrets
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
    scripts:
      - name: Write GoogleService-Info.plist and get Flutter packages
        script: |
          #!/bin/sh
          set -e
          set -x
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > $CM_BUILD_DIR/mobile/ios/Runner/GoogleService-Info.plist
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -type f -execdir pod install --repo-update \;
      - name: Flutter build ipa (release)
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=https://api.fix-pro.app \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - external tester ios
        submit_to_app_store: false
